<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIKARI ./VIEWER</title>
<style>
:root{--bg:#fafaf8;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#e3e3df;--ac:#2563eb;--code:#f0f0ec;--s:#0a7a3b;--n:#b45309;--b:#7c3aed;--hk:#cf222e;--hs:#0a3069;--hc:#6e7781;--hn:#0550ae;--ht:#8250df;--ha:#116329;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--fg:#e6e6e3;--mut:#9aa0a6;--card:#1e2024;--bd:#33363b;--ac:#7aa7ff;--code:#26292e;--s:#7ee2a0;--n:#f5b461;--b:#c4a1ff;--hk:#ff7b72;--hs:#a5d6ff;--hc:#8b949e;--hn:#79c0ff;--ht:#d2a8ff;--ha:#7ee787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#e6e6e3;--mut:#9aa0a6;--card:#1e2024;--bd:#33363b;--ac:#7aa7ff;--code:#26292e;--s:#7ee2a0;--n:#f5b461;--b:#c4a1ff;--hk:#ff7b72;--hs:#a5d6ff;--hc:#8b949e;--hn:#79c0ff;--ht:#d2a8ff;--ha:#7ee787;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd)}
.bar{display:flex;gap:6px;align-items:center;padding:6px 10px}
.brand{flex:1;font:700 14px ui-monospace,monospace;letter-spacing:.08em;white-space:nowrap}.brand span{color:var(--ac)}
button,label.btn,select{font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
label.btn,button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center}
#tabs{display:none;overflow-x:auto;background:var(--code);scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 6px 7px 10px;border-right:1px solid var(--bd);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px;cursor:pointer;color:var(--mut);max-width:210px;flex:none}
.tab span,.it span{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--bg);color:var(--fg);border-bottom-color:var(--ac)}
.tab i,.it i{font:700 9px ui-monospace,monospace;font-style:normal;padding:1px 4px;border-radius:4px;background:var(--bd);color:var(--fg)}
.tab b,.it b{width:22px;height:22px;line-height:20px;text-align:center;border-radius:5px;font-weight:400;flex:none}
.tab b:hover,.it b:hover{background:var(--bd)}
#wrap{display:flex;align-items:flex-start}
#content{flex:1;min-width:0}
#sb{display:none;width:270px;flex:none;position:sticky;top:var(--hh,90px);height:calc(100vh - var(--hh,90px));overflow-y:auto;background:var(--card);border-right:1px solid var(--bd);padding:8px}
#sb.on{display:flex;flex-direction:column}
#sf{margin-top:auto;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 4px 4px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 2px;font-size:13px;color:var(--mut)}
.sp{display:flex;gap:6px}
#bd{display:none;position:fixed;left:0;right:0;bottom:0;top:var(--hh,90px);background:#0006;z-index:7}
#bd.on{display:block}
@media (max-width:899px){#sb{position:fixed;left:0;top:var(--hh,90px);bottom:0;height:auto;z-index:8;width:min(82vw,300px);box-shadow:4px 0 20px #0005}}
@media (min-width:900px){#bd{display:none!important}}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sg>*{text-align:center}.sg .w{grid-column:1/3}
.sh{display:flex;justify-content:space-between;align-items:center;font:700 11px system-ui;letter-spacing:.08em;color:var(--mut);margin:14px 6px 6px}
.sh button{font-size:11px;padding:2px 6px}
.it{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.it:hover,.it.on{background:var(--code)}.it span{flex:1;white-space:nowrap}.it small{color:var(--mut);font-size:10px}
.none{color:var(--mut);font-size:12px;padding:4px 6px}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}main.wide{max-width:1100px}
#paste{display:none;max-width:760px;margin:0 auto;padding:12px 16px 0}
#paste textarea{width:100%;height:150px;margin:6px 0;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:13px/1.5 ui-monospace,monospace}
#empty{text-align:center;color:var(--mut);padding:50px 10px}
#out{overflow-wrap:anywhere}
#out h1,#out h2{border-bottom:1px solid var(--bd);padding-bottom:.25em}
#out h1{font-size:1.8em}#out h2{font-size:1.4em}#out h3{font-size:1.15em}
#out a{color:var(--ac)}
#out code{background:var(--code);padding:.15em .35em;border-radius:5px;font:.9em ui-monospace,monospace}
#out pre{background:var(--code);padding:12px;border-radius:8px;overflow-x:auto}
#out pre code{padding:0;background:none}
#out blockquote{margin:1em 0;padding:.1em 1em;border-left:4px solid var(--bd);color:var(--mut)}
#out hr{border:0;border-top:1px solid var(--bd);margin:1.5em 0}
#out img{max-width:100%;height:auto;border-radius:6px}
#out .att{background:var(--code);padding:.1em .5em;border-radius:6px}
#out .tw{overflow:auto;max-height:75vh;margin:1em 0;border:1px solid var(--bd);border-radius:10px;-webkit-overflow-scrolling:touch}
#out .tw table{border-collapse:separate;border-spacing:0;margin:0;width:max-content;min-width:100%;font-size:.88em;line-height:1.45}
#out .tw th,#out .tw td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;min-width:56px;max-width:300px;overflow-wrap:anywhere}
@media (max-width:600px){#out .tw table{font-size:.78em}#out .tw th,#out .tw td{padding:5px 7px;max-width:220px}}
#out .tw:not(.cards) th:first-child,#out .tw:not(.cards) td:first-child{position:sticky;left:0;max-width:40vw;box-shadow:1px 0 0 var(--bd)}
#out .tw:not(.cards) th:first-child{z-index:2}
#out .tw:not(.cards) td:first-child{background:var(--bg);z-index:1}
#out .tw:not(.cards) tbody tr:nth-child(even) td:first-child{background:var(--code)}
#out .tw th{background:var(--code);position:sticky;top:0;z-index:1;white-space:nowrap}
#out .tw tbody tr:nth-child(even) td{background:var(--code)}
#out .tw tr:last-child td{border-bottom:0}
#out .tw.cards{max-height:none;overflow:visible;border:0;border-radius:0}
#out .tw.cards table,#out .tw.cards tbody,#out .tw.cards tr,#out .tw.cards td{display:block;width:100%;max-width:none;min-width:0}
#out .tw.cards thead{display:none}
#out .tw.cards tr{margin:0 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden}
#out .tw.cards tbody tr:nth-child(even) td{background:none}
#out .tw.cards td{display:flex;gap:10px;border-bottom:1px solid var(--bd)}
#out .tw.cards td:last-child{border-bottom:0}
#out .tw.cards td::before{content:attr(data-l);flex:0 0 36%;max-width:36%;color:var(--mut);font-size:.85em;font-weight:600}
#out .tw.cards .v{flex:1;min-width:0}
.cb{position:relative;margin:1em 0}
#out .cb pre{margin:0;padding-right:46px}
.cp{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--mut)}
.cp:hover{color:var(--fg)}
.mmw{overflow-x:auto;margin:1em 0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
#out pre.mermaid{background:none;padding:0;margin:0;text-align:center;overflow:visible}
#out li{margin:.2em 0}#out li.t{list-style:none;margin-left:-1.2em}
#out h1,#out h2,#out h3,#out h4,#out h5,#out h6{scroll-margin-top:calc(var(--hh,90px) + 8px)}
#out img{cursor:zoom-in}#out a img{cursor:pointer}
#out th[data-a=sort]{cursor:pointer;user-select:none}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag,.hljs-deletion{color:var(--hk)}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--hs)}
.hljs-comment,.hljs-quote{color:var(--hc);font-style:italic}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-variable,.hljs-template-variable{color:var(--hn)}
.hljs-title,.hljs-section,.hljs-built_in,.hljs-type{color:var(--ht)}
.hljs-attr,.hljs-attribute,.hljs-name,.hljs-selector-class,.hljs-selector-id,.hljs-tag,.hljs-property{color:var(--ha)}
.ur{display:flex;gap:6px;margin-top:8px}
.ur input{flex:1;min-width:0;padding:7px 9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
#lb{display:none;position:fixed;inset:0;z-index:30;background:#000e;align-items:center;justify-content:center;padding:12px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain}
#tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
#tools input{flex:1;min-width:120px;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:14px}
#tools .m{color:var(--mut);font-size:12px}
.jt{font:13px/1.55 ui-monospace,monospace}.jt .in{margin-left:1.1em;border-left:1px dotted var(--bd);padding-left:.7em}
.jt summary{cursor:pointer}.jt .k{color:var(--ac)}.jt .s{color:var(--s)}.jt .n{color:var(--n)}.jt .b{color:var(--b)}.jt .z,.jt .m{color:var(--mut)}.jt .m{font-size:11px}
#frw{display:none}
#hbar{padding:6px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd);color:var(--mut);font-size:12px}
#fr{display:block;width:100%;border:0;background:#fff}
#src{display:none;margin:0;padding:12px;overflow:auto;font:12px/1.5 ui-monospace,monospace;background:var(--code)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;display:none}
</style>
</head>
<body>
<div id="top">
<div class="bar">
<button data-a="menu" aria-label="Sidebar">☰</button>
<div class="brand">HIKARI <span>./VIEWER</span></div>
</div>
<div id="tabs"></div>
</div>
<div id="bd" data-a="menu"></div>
<div id="wrap">
<aside id="sb">
<div class="sg">
<label class="btn" for="f">Open file</label>
<label class="btn" for="fd">Open folder</label>
<button class="w" data-a="paste">Paste text</button>
</div>
<input id="f" type="file" multiple hidden>
<input id="fd" type="file" webkitdirectory multiple hidden>
<div class="ur"><input id="url" placeholder="Open URL (raw or GitHub link)"><button data-a="url">Go</button></div>
<div id="sOpen"></div>
<div id="sOut"></div>
<div class="sh"><span>HISTORY</span><button data-a="clear">Clear</button></div>
<div id="sHist"></div>
<div id="sf">
<div class="sr"><span>Text size</span><span class="sp"><button data-a="f-">A−</button><button data-a="f+">A+</button></span></div>
<div class="sr"><span>Theme</span><button id="th" data-a="theme">☀ Light</button></div>
</div>
</aside>
<div id="content">
<div id="paste"><select id="pt"><option value="md">Markdown</option><option value="csv">CSV</option><option value="json">JSON</option><option value="html">HTML</option></select><textarea id="ta" placeholder="Paste text here"></textarea><button class="p" data-a="pasteok">Open</button></div>
<main>
<div id="empty">Tap <b>☰</b> then <b>Open file</b> to view .md .csv .json .html files.<br>To show attachments (images, css, js), select them together with the document.<br>Opened files are saved in this browser, so reloading brings them back.<br>Nothing is uploaded anywhere.</div>
<div id="tools"></div>
<article id="out"></article>
</main>
<div id="frw"><div id="hbar"><button data-a="src">View source</button><span>Running in a sandbox</span></div><iframe id="fr" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe><pre id="src"></pre></div>
</div>
</div>
<div id="toast"></div>
<div id="lb"></div>
<script>
const $=s=>document.querySelector(s),R=document.documentElement;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ea=s=>esc(String(s)).replace(/"/g,'&quot;');
const IC_COPY='<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>';
const IC_OK='<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';
const EXT={md:'md',markdown:'md',txt:'md',csv:'csv',tsv:'csv',json:'json',html:'html',htm:'html'};
const IMG=/^(png|jpe?g|gif|webp|svg|bmp|avif)$/;
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const base=p=>{let s=String(p).split(/[?#]/)[0];try{s=decodeURIComponent(s)}catch(e){}return s.split(/[\\/]/).pop().toLowerCase()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const safe=p=>p.catch(()=>{});
const rd=(f,u)=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(String(x.result));u?x.readAsDataURL(f):x.readAsText(f)});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
/* storage */
let db;
const idb=()=>new Promise((res,rej)=>{if(db)return res(db);const r=indexedDB.open('hikari-viewer',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});r.result.createObjectStore('sets',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)});
const tx=(s,m,f)=>idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),getA=s=>tx(s,'readonly',o=>o.getAll()),getK=(s,k)=>tx(s,'readonly',o=>o.get(k)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
/* state */
let hist=[],open=[],active=null,att=Object.create(null),sbOpen=false,fs=16,th='light',restoreY=0;const setCache={};
let curBase=null,slugs={},toc=[],CS=null;
const byId=id=>hist.find(d=>d.id===id);
function saveState(){try{localStorage.setItem('hv-state',JSON.stringify({open,active,sb:sbOpen,fs,th,thv:2,y:scrollY}))}catch(e){}}
async function loadSet(id){
  if(!id)return Object.create(null);
  if(!setCache[id]){const r=await safe(getK('sets',id));setCache[id]=Object.assign(Object.create(null),r&&r.att)}
  return setCache[id];
}
async function prune(){
  hist.sort((a,b)=>b.time-a.time);
  while(hist.length>60){const d=hist.pop();open=open.filter(x=>x!==d.id);safe(del('docs',d.id))}
  const used=new Set(hist.map(d=>d.setId));
  for(const s of (await safe(getA('sets')))||[])if(!used.has(s.id)){safe(del('sets',s.id));delete setCache[s.id]}
}
async function commit(ds,a){
  const sid=Object.keys(a).length?uid():null;
  if(sid){setCache[sid]=a;safe(put('sets',{id:sid,att:{...a}}))}
  let first;
  for(const d of ds){
    const old=hist.find(h=>h.name===d.name);
    const rec={id:old?old.id:uid(),name:d.name,type:d.type,text:d.text,size:d.text.length,time:Date.now(),setId:sid||(old&&old.setId)||null,baseUrl:d.baseUrl||null};
    if(old)hist.splice(hist.indexOf(old),1);
    hist.unshift(rec);safe(put('docs',rec));first=first||rec.id;
  }
  await prune();
  await show(first);
}
async function addFiles(files){
  const a=Object.create(null),ds=[];
  for(const f of files){
    const e=ext(f.name),n=f.name.toLowerCase();
    if(EXT[e])ds.push({name:f.name,type:EXT[e],text:await rd(f)});
    else if(IMG.test(e))a[n]=await rd(f,1);
    else if(e==='css'||e==='js')a[n]=await rd(f);
    else a[n]='';
  }
  if(!ds.length)return toast('No supported file (md, csv, json, html)');
  if(innerWidth<900)setSb(false);
  await commit(ds,a);
}
/* UI */
const ago=t=>new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const kb=n=>n<1024?n+' B':(n/1024).toFixed(n<10240?1:0)+' KB';
function setHH(){R.style.setProperty('--hh',((parseInt(getComputedStyle(R).paddingTop)||0)+$('#top').offsetHeight)+'px')}
function refresh(){
  const T=$('#tabs');
  T.style.display=open.length?'flex':'none';
  T.innerHTML=open.map(id=>{const d=byId(id);return '<div class="tab'+(id===active?' on':'')+'" data-a="tab" data-id="'+id+'"><i>'+d.type.toUpperCase()+'</i><span>'+esc(d.name)+'</span><b data-a="close" data-id="'+id+'" aria-label="Close tab">×</b></div>'}).join('');
  const on=T.querySelector('.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
  $('#sOpen').innerHTML=open.length?'<div class="sh"><span>OPEN FILES</span></div>'+open.map(id=>{const d=byId(id);return '<div class="it'+(id===active?' on':'')+'" data-a="tab" data-id="'+id+'"><i>'+d.type.toUpperCase()+'</i><span>'+esc(d.name)+'</span><b data-a="close" data-id="'+id+'">×</b></div>'}).join(''):'';
  $('#sHist').innerHTML=hist.length?hist.map(d=>'<div class="it" data-a="tab" data-id="'+d.id+'"><i>'+d.type.toUpperCase()+'</i><span>'+esc(d.name)+'</span><small>'+ago(d.time)+' · '+kb(d.size)+'</small><b data-a="del" data-id="'+d.id+'" aria-label="Remove from history">×</b></div>').join(''):'<div class="none">No files yet</div>';
  setHH();saveState();
}
function clearView(){
  $('#frw').style.display='none';$('main').style.display='';$('main').className='';
  $('#empty').style.display='';$('#tools').innerHTML='';$('#out').innerHTML='';$('#sOut').innerHTML='';
}
function closeTab(id){
  const i=open.indexOf(id);if(i<0)return;
  open.splice(i,1);
  if(active!==id)return refresh();
  active=open[i]||open[i-1]||null;
  if(active)show(active);else{clearView();refresh()}
}
function delDoc(id){
  const d=byId(id);if(!d)return;
  hist.splice(hist.indexOf(d),1);safe(del('docs',id));
  if(d.setId&&!hist.some(h=>h.setId===d.setId)){safe(del('sets',d.setId));delete setCache[d.setId]}
  if(open.includes(id))closeTab(id);else refresh();
}
function setSb(v){sbOpen=v;$('#sb').classList.toggle('on',v);$('#bd').classList.toggle('on',v);saveState()}
function applyTh(){
  if(th==='auto')R.removeAttribute('data-theme');else R.setAttribute('data-theme',th);
  $('#th').textContent={auto:'◐ Auto',light:'☀ Light',dark:'☾ Dark'}[th];saveState();
  if(document.querySelector('#out pre.mermaid'))runMM();
}
/* markdown */
function img(u,alt){
  if(/^data:image\//i.test(u)||/^https?:/i.test(u))return '<img src="'+u.replace(/"/g,'%22')+'" alt="'+alt+'" loading="lazy" referrerpolicy="no-referrer">';
  const n=base(u),a=att[n];
  if(a&&a.startsWith('data:'))return '<img src="'+a+'" alt="'+alt+'">';
  if(curBase){try{return '<img src="'+new URL(u,curBase).href.replace(/"/g,'%22')+'" alt="'+alt+'" loading="lazy" referrerpolicy="no-referrer">'}catch(e){}}
  return '<em>[attachment not found: '+n+' (select it together with the document)]</em>';
}
function inline(t){
  const codes=[],st=[];
  t=t.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  t=esc(t);
  const S=h=>{st.push(h);return '\u0001'+(st.length-1)+'\u0001'};
  t=t.replace(/!\[\[([^\]|]+)(?:\|[^\]]*)?\]\]/g,(m,n)=>S(img(n,'')));
  t=t.replace(/!\[([^\]]*)\]\(([^)]+?)(?:\s+"[^"]*")?\)/g,(m,a,u)=>S(img(u.trim().replace(/^&lt;|&gt;$/g,''),a)));
  t=t.replace(/\[([^\]]+)\]\(([^)]+?)(?:\s+"[^"]*")?\)/g,(m,a,u)=>{
    u=u.trim().replace(/^&lt;|&gt;$/g,'');
    if(/^(https?:|mailto:|#)/i.test(u))return S('<a href="'+u.replace(/"/g,'%22')+'"'+(u[0]==='#'?'':' target="_blank" rel="noopener"')+'>'+a+'</a>');
    return base(u) in att?S('<span class="att">\uD83D\uDCCE '+a+'</span>'):a;
  });
  t=t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,p,u)=>{const tr=(u.match(/[.,;:!?]+$/)||[''])[0];u=u.slice(0,u.length-tr.length);return p+S('<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>')+tr});
  t=t.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g,(m,a,b)=>'<strong>'+(a||b)+'</strong>');
  t=t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  t=t.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  t=t.replace(/\u0001(\d+)\u0001/g,(m,i)=>st[i]);
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+esc(codes[i])+'</code>');
}
function heading(n,t){
  const plain=t.replace(/!?\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[`*_~]/g,'').trim();
  let sl=plain.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s/g,'-')||'section';
  const c=slugs[sl]=(slugs[sl]||0)+1;if(c>1)sl+='-'+(c-1);
  toc.push([n,plain,'h-'+sl]);
  return '<h'+n+' id="h-'+sl+'">'+inline(t)+'</h'+n+'>';
}
function outline(){$('#sOut').innerHTML=toc.length?'<div class="sh"><span>OUTLINE</span></div>'+toc.slice(0,200).map(x=>'<div class="it" data-a="go" data-id="'+x[2]+'" style="padding-left:'+((x[0]-1)*12+6)+'px"><span>'+esc(x[1])+'</span></div>').join(''):''}
const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
const LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const START=l=>/^\s*(```|~~~|#{1,6}\s|>)/.test(l)||LI.test(l)||/^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
function md(src){
  const L=src.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n'),o=[];let i=0,m;
  while(i<L.length){
    const l=L[i];
    if(m=l.match(/^\s*(```|~~~)\s*([\w+#.-]*)/)){const f=m[1],lg=m[2].toLowerCase(),b=[];i++;while(i<L.length&&!L[i].trim().startsWith(f)){b.push(L[i]);i++}i++;const c=b.join('\n');o.push(lg==='mermaid'?'<div class="mmw"><pre class="mermaid" data-src="'+ea(c)+'">'+esc(c)+'</pre></div>':'<div class="cb"><button class="cp" data-a="copy" aria-label="Copy code" title="Copy">'+IC_COPY+'</button><pre><code data-lg="'+ea(lg)+'">'+esc(c)+'</code></pre></div>');continue}
    if(!l.trim()){i++;continue}
    if(m=l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/)){o.push(heading(m[1].length,m[2]));i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){o.push('<hr>');i++;continue}
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*> ?/,''));i++}o.push('<blockquote>'+md(b.join('\n'))+'</blockquote>');continue}
    if(l.includes('|')&&i+1<L.length&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(L[i+1])){
      const h=cells(l),rows=[];i+=2;
      while(i<L.length&&L[i].trim()&&L[i].includes('|')){rows.push(cells(L[i]));i++}
      o.push('<div class="tw"><table><thead><tr>'+h.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+h.map((_,k)=>'<td data-l="'+ea(h[k])+'"><span class="v">'+inline(r[k]||'')+'</span></td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;
    }
    if(m=l.match(LI)){
      const bs=m[1].length,tag=/\d/.test(m[2])?'ol':'ul',items=[];
      while(i<L.length){
        const x=L[i],mm=x.match(LI);
        if(mm&&mm[1].length<=bs){if(mm[1].length<bs)break;items.push([mm[3]]);i++}
        else if(!x.trim()){const n=L[i+1]&&L[i+1].match(LI);if(n&&n[1].length>=bs)i++;else break}
        else if(items.length&&/^\s/.test(x)){items[items.length-1].push(x.slice(Math.min(x.match(/^\s*/)[0].length,bs+2)));i++}
        else break;
      }
      o.push('<'+tag+'>'+items.map(it=>{
        let f=it[0],c='';const rest=it.slice(1).join('\n'),t=f.match(/^\[([ xX])\]\s+(.*)/);
        if(t){f=(t[1]===' '?'\u2610 ':'\u2611 ')+t[2];c=' class="t"'}
        return '<li'+c+'>'+inline(f)+(rest.trim()?md(rest):'')+'</li>';
      }).join('')+'</'+tag+'>');continue;
    }
    const p=[l];i++;
    while(i<L.length&&L[i].trim()&&!START(L[i])){p.push(L[i]);i++}
    o.push('<p>'+p.map(s=>inline(s.replace(/\s+$/,''))+(/ {2,}$/.test(s)?'<br>':'')).join(' ')+'</p>');
  }
  return o.join('\n');
}
/* csv */
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');
  const first=t.split('\n')[0],d=[',',';','\t','|'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch;
  }
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows.filter(r=>r.some(x=>x!==''));
}
function csv(d){
  const rows=parseCSV(d.text);
  if(!rows.length){$('#out').innerHTML='<p>Empty CSV.</p>';return}
  CS={h:rows[0],b:rows.slice(1),c:-1,dir:1};
  $('#tools').innerHTML='<input id="flt" placeholder="Search table"><button id="cv" data-a="cards">Card view</button><span class="m">'+(rows.length-1)+' rows × '+rows[0].length+' cols'+(rows.length-1>3000?' (showing first 3000)':'')+' · tap a header to sort</span>';
  csvRender();
}
function csvRender(){
  const {h,c,dir}=CS,old=$('#out .tw'),cards=old&&old.classList.contains('cards');
  let b=CS.b;
  if(c>=0){
    const nv=v=>String(v).replace(/[,\s]/g,''),isn=v=>v!==''&&!isNaN(nv(v));
    b=[...b].sort((x,y)=>{const p=x[c]||'',q=y[c]||'';return (isn(p)&&isn(q)?parseFloat(nv(p))-parseFloat(nv(q)):p.localeCompare(q,undefined,{numeric:true,sensitivity:'base'}))*dir});
  }
  b=b.slice(0,3000);
  $('#out').innerHTML='<div class="tw'+(cards?' cards':'')+'"><table><thead><tr>'+h.map((x,i)=>'<th data-a="sort" data-c="'+i+'">'+esc(x)+(i===c?(dir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>'+b.map(r=>'<tr>'+h.map((_,i)=>'<td data-l="'+ea(h[i])+'"><span class="v">'+esc(r[i]||'')+'</span></td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  const q=$('#flt');if(q&&q.value)q.dispatchEvent(new Event('input',{bubbles:true}));
}
/* json */
function jt(v,k,dp){
  const key=k!==undefined?'<span class="k">'+esc(String(k))+'</span>: ':'';
  if(v===null)return '<div>'+key+'<span class="z">null</span></div>';
  if(typeof v==='object'){
    const a=Array.isArray(v),ks=Object.keys(v),br=a?'[]':'{}';
    if(!ks.length)return '<div>'+key+br+'</div>';
    return '<details'+(dp<2?' open':'')+'><summary>'+key+br[0]+' <span class="m">'+ks.length+(a?' items':' keys')+'</span></summary><div class="in">'+ks.map(x=>jt(v[x],x,dp+1)).join('')+'</div>'+br[1]+'</details>';
  }
  const c=typeof v==='string'?'s':typeof v==='number'?'n':'b';
  return '<div>'+key+'<span class="'+c+'">'+esc(typeof v==='string'?JSON.stringify(v):String(v))+'</span></div>';
}
function json(d){
  $('#tools').innerHTML='<button data-a="jo">Expand all</button><button data-a="jc">Collapse all</button>';
  try{$('#out').innerHTML='<div class="jt">'+jt(JSON.parse(d.text.replace(/^\uFEFF/,'')),undefined,0)+'</div>'}
  catch(e){$('#out').innerHTML='<p><b>Invalid JSON:</b> '+esc(e.message)+'</p><pre><code>'+esc(d.text)+'</code></pre>'}
}
/* html */
function buildHTML(t){
  const doc=new DOMParser().parseFromString(t,'text/html');
  doc.querySelectorAll('img[src],source[src]').forEach(e=>{const a=att[base(e.getAttribute('src'))];if(a&&a.startsWith('data:'))e.setAttribute('src',a)});
  doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(e=>{const a=att[base(e.getAttribute('href'))];if(a!==undefined&&!a.startsWith('data:')){const s=doc.createElement('style');s.textContent=a;e.replaceWith(s)}});
  doc.querySelectorAll('script[src]').forEach(e=>{const a=att[base(e.getAttribute('src'))];if(a!==undefined&&!a.startsWith('data:')){const s=doc.createElement('script');s.textContent=a;e.replaceWith(s)}});
  return '<!DOCTYPE html>'+doc.documentElement.outerHTML;
}
function sizeFr(){$('#fr').style.height=Math.max(300,innerHeight-(parseInt(getComputedStyle(R).getPropertyValue('--hh'))||0)-$('#hbar').offsetHeight)+'px'}
function html(d){
  $('main').style.display='none';$('#frw').style.display='block';
  $('#fr').style.display='block';$('#src').style.display='none';
  $('#hbar button').textContent='View source';
  $('#fr').srcdoc=buildHTML(d.text);$('#src').textContent=d.text;sizeFr();
}
async function show(id){
  const d=byId(id);if(!d)return;
  active=id;if(!open.includes(id))open.push(id);
  att=await loadSet(d.setId);
  if(active!==id)return;
  refresh();
  $('#frw').style.display='none';$('main').style.display='';
  $('#empty').style.display='none';$('#tools').innerHTML='';
  $('main').className=d.type==='md'?'':'wide';
  curBase=d.baseUrl||null;slugs={};toc=[];$('#sOut').innerHTML='';
  if(d.type==='md'){$('#out').innerHTML=md(d.text);outline()}
  else if(d.type==='csv')csv(d);
  else if(d.type==='json')json(d);
  else html(d);
  adapt();syncCv();scrollTo(0,restoreY);restoreY=0;
  if(d.type==='md'){runMM();runHL()}
}
/* tables, copy, diagrams */
function adapt(){}
function syncCv(){const w=$('#out .tw'),b=$('#cv');if(w&&b)b.textContent=w.classList.contains('cards')?'Table view':'Card view'}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.appendChild(x);x.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}x.remove();return ok;
  }
}
let mmP=null;
function loadMM(){
  return mmP||(mmP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
    s.onload=()=>res(window.mermaid);s.onerror=()=>{mmP=null;rej(new Error('load'))};
    document.head.appendChild(s);
  }));
}
async function runMM(){
  const ns=[...document.querySelectorAll('#out pre.mermaid')];if(!ns.length)return;
  try{
    const m=await loadMM(),dk=R.dataset.theme==='dark'||(!R.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
    m.initialize({startOnLoad:false,theme:dk?'dark':'default',securityLevel:'strict'});
    ns.forEach(n=>{n.removeAttribute('data-processed');n.textContent=n.dataset.src});
    await m.run({nodes:ns,suppressErrors:true});
  }catch(e){toast('Diagram renderer could not load (internet needed)')}
}
let hlP=null;
function loadHL(){
  return hlP||(hlP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
    s.onload=()=>res(window.hljs);s.onerror=()=>{hlP=null;rej(new Error('load'))};
    document.head.appendChild(s);
  }));
}
async function runHL(){
  const ns=[...document.querySelectorAll('#out .cb code[data-lg]')].filter(n=>n.dataset.lg);if(!ns.length)return;
  try{const h=await loadHL();ns.forEach(n=>{const l=n.dataset.lg;if(h.getLanguage(l)&&!n.dataset.highlighted){n.className='language-'+l;h.highlightElement(n)}})}catch(e){}
}
async function openUrl(u){
  u=(u||'').trim();if(!u)return;
  const g=u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
  if(g)u='https://raw.githubusercontent.com/'+g[1]+'/'+g[2]+'/'+g[3];
  try{
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);
    const text=await r.text(),path=u.split(/[?#]/)[0],parts=path.split('/').filter(Boolean);
    const name=decodeURIComponent(parts.slice(-2).join('/')),e=ext(parts[parts.length-1]||'');
    if(innerWidth<900)setSb(false);
    await commit([{name,type:EXT[e]||'md',text,baseUrl:path.slice(0,path.lastIndexOf('/')+1)}],Object.create(null));
  }catch(e){toast('Could not fetch that URL (check the link; the host must allow CORS)')}
}
/* events */
document.addEventListener('click',e=>{
  const lb=$('#lb');
  if(e.target.closest('#lb')){lb.classList.remove('on');return}
  if(e.target.matches('#out img')&&!e.target.closest('a')){const im=new Image();im.src=e.target.src;lb.replaceChildren(im);lb.classList.add('on');return}
  const al=e.target.closest('#out a[href^="#"]');
  if(al){e.preventDefault();let f=al.getAttribute('href').slice(1);try{f=decodeURIComponent(f)}catch(_){}const t=document.getElementById('h-'+f.toLowerCase().replace(/\s/g,'-'));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
  const a=e.target.closest('[data-a]');if(!a)return;
  const k=a.dataset.a,id=a.dataset.id;
  if(k==='copy'){const c=a.closest('.cb').querySelector('code').textContent;copyText(c).then(ok=>{a.innerHTML=ok?IC_OK:IC_COPY;a.style.color=ok?'var(--s)':'';if(!ok)toast('Copy failed');setTimeout(()=>{a.innerHTML=IC_COPY;a.style.color=''},1800)})}
  else if(k==='go'){const t=document.getElementById(id);if(t){if(innerWidth<900)setSb(false);t.scrollIntoView({behavior:'smooth',block:'start'})}}
  else if(k==='sort'){const i=+a.dataset.c;CS.dir=CS.c===i?-CS.dir:1;CS.c=i;csvRender()}
  else if(k==='url')openUrl($('#url').value);
  else if(k==='cards'){const w=$('#out .tw');if(w){w.removeAttribute('data-auto');w.classList.toggle('cards');syncCv()}}
  else if(k==='tab'){if(innerWidth<900)setSb(false);show(id)}
  else if(k==='close')closeTab(id);
  else if(k==='del')delDoc(id);
  else if(k==='menu')setSb(!sbOpen);
  else if(k==='clear'){if(hist.length&&confirm('Remove all files from history?')){[...hist].forEach(d=>safe(del('docs',d.id)));hist=[];open=[];active=null;safe(getA('sets').then(s=>s.forEach(x=>del('sets',x.id))));Object.keys(setCache).forEach(x=>delete setCache[x]);clearView();refresh()}}
  else if(k==='theme'){th={light:'dark',dark:'auto',auto:'light'}[th];applyTh()}
  else if(k==='paste'){const p=$('#paste');p.style.display=p.style.display==='block'?'none':'block';if(innerWidth<900)setSb(false)}
  else if(k==='pasteok'){const t=$('#ta').value,ty=$('#pt').value;if(!t.trim())return;
    const n=hist.filter(h=>/^pasted-/.test(h.name)).length+1;$('#paste').style.display='none';$('#ta').value='';commit([{name:'pasted-'+n+'.'+ty,type:ty,text:t}],Object.create(null))}
  else if(k==='f-'||k==='f+'){fs=Math.max(12,Math.min(26,fs+(k==='f+'?1:-1)));document.body.style.fontSize=fs+'px';saveState()}
  else if(k==='jo'||k==='jc')document.querySelectorAll('.jt details').forEach(x=>x.open=k==='jo');
  else if(k==='src'){const s=$('#src'),f=$('#fr'),on=s.style.display==='block';s.style.display=on?'none':'block';f.style.display=on?'block':'none';a.textContent=on?'View source':'View preview'}
});
document.addEventListener('input',e=>{
  if(e.target.id==='flt'){const q=e.target.value.toLowerCase();document.querySelectorAll('#out tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
});
['#f','#fd'].forEach(s=>$(s).addEventListener('change',e=>{const fl=[...e.target.files];e.target.value='';if(fl.length)addFiles(fl)}));
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')openUrl(e.target.value)});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const fl=[...e.dataTransfer.files];if(fl.length)addFiles(fl)});
let sT;addEventListener('scroll',()=>{clearTimeout(sT);sT=setTimeout(saveState,300)});
addEventListener('pagehide',saveState);
addEventListener('resize',()=>{setHH();adapt();if(active&&byId(active)&&byId(active).type==='html')sizeFr()});
/* restore */
(async()=>{
  let st={};try{st=JSON.parse(localStorage.getItem('hv-state'))||{}}catch(e){}
  th=st.thv===2&&st.th?st.th:'light';applyTh();
  fs=st.fs||16;document.body.style.fontSize=fs+'px';
  hist=(await safe(getA('docs')))||[];
  hist.sort((a,b)=>b.time-a.time);
  open=(st.open||[]).filter(id=>byId(id));
  setSb(st.sb===undefined?innerWidth>=900:st.sb);
  active=byId(st.active)?st.active:open[0]||null;
  restoreY=st.y||0;
  if(active)show(active);else{clearView();refresh()}
  const qu=new URLSearchParams(location.search).get('url');if(qu)openUrl(qu);
})();
